// ---------- PWA Service Worker Registration ----------
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

// ---------- Web Audio & Haptic Feedback ----------
const playPOSSound = (type) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === "add") {
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(); osc.stop(ctx.currentTime + 0.08);
    } else if (type === "success") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    } else if (type === "error") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    }
  } catch (e) {}
};

const triggerHaptic = (ms = 12) => {
  if ("vibrate" in navigator) navigator.vibrate(ms);
};

// ---------- Pure JS Canvas Confetti Burst ----------
function triggerCheckoutConfetti() {
  const canvas = document.createElement("canvas");
  canvas.style.position = "fixed";
  canvas.style.top = "0"; canvas.style.left = "0";
  canvas.style.width = "100vw"; canvas.style.height = "100vh";
  canvas.style.pointerEvents = "none"; canvas.style.zIndex = "99999";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;

  const particles = Array.from({ length: 55 }, () => ({
    x: canvas.width / 2, y: canvas.height / 2 + 80,
    vx: (Math.random() - 0.5) * 14, vy: Math.random() * -15 - 5,
    size: Math.random() * 7 + 4,
    color: ["#B85C70", "#D48C9D", "#3B7A57", "#E2D4D8", "#FAD0C4", "#FFD1DC"][Math.floor(Math.random() * 6)],
    rotation: Math.random() * 360,
  }));

  let opacity = 1;
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    opacity -= 0.018;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.42;
      ctx.save();
      ctx.globalAlpha = Math.max(0, opacity);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    if (opacity > 0) requestAnimationFrame(loop);
    else canvas.remove();
  }
  loop();
}

// ---------- Offline-First IndexedDB Engine ----------
const DB_NAME = "MakaraPOS_DB";
const DB_VERSION = 1;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      ["products", "sales", "settings", "stockLog"].forEach(store => {
        if (!db.objectStoreNames.contains(store)) db.createObjectStore(store);
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getDBItem(store, key, fallback) {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const tx = db.transaction(store, "readonly");
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : fallback);
      req.onerror = () => resolve(fallback);
    });
  } catch { return fallback; }
}

async function setDBItem(store, key, val) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, "readwrite");
      const req = tx.objectStore(store).put(val, key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  } catch { return false; }
}

// Migration from legacy localStorage into IndexedDB
async function syncLegacyStorage() {
  const keys = ["products", "sales", "settings", "stockLog"];
  for (const k of keys) {
    const legacy = localStorage.getItem(`acacia_pos_${k}`);
    if (legacy) {
      try {
        await setDBItem(k, "main", JSON.parse(legacy));
      } catch (e) {}
    }
  }
}

function useT() {
  const lang = React.useContext(LangContext);

}

// ---------- Currency Format Helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clampQty = (n) => Math.max(0, Math.floor(Number(n) || 0));

const moneyUSD = (n) => `$${(Number(n) || 0).toFixed(2)}`;
const moneyKHR = (usd, rate = 4100) => `៛${(Math.round(((Number(usd) || 0) * rate) / 100) * 100).toLocaleString()}`;

function dayKey(ts) { return new Date(ts).toISOString().slice(0, 10); }
function weekKey(ts) {
  const date = new Date(ts);
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()} · Wk ${String(weekNo).padStart(2, "0")}`;
}
function monthKey(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }
const PERIOD_FN = { day: dayKey, week: weekKey, month: monthKey };

function compressImage(file, maxWidth = 420, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Smooth Animated Numeric Display ----------
function AnimatedNumber({ value, formatter = moneyUSD, rate = 4100 }) {
  const [displayVal, setDisplayVal] = useState(value);
  useEffect(() => {
    let startTimestamp;
    const startValue = displayVal;
    const duration = 220;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      setDisplayVal(startValue + (value - startValue) * progress);
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [value]);

  return h("span", { className: "tabular-nums" }, formatter(displayVal, rate));
}

// ---------- Reports Page ----------
function ReportsPage({ sales, products, exchangeRate }) {
  const t = useT();
  const [period, setPeriod] = useState("day");

  const activeSales = useMemo(() => sales.filter(s => !s.voided), [sales]);
  const stockCost = useMemo(() => products.reduce((s, p) => s + (Number(p.cost) || 0) * (Number(p.qty) || 0), 0), [products]);
  const stockValue = useMemo(() => products.reduce((s, p) => s + (Number(p.price) || 0) * (Number(p.qty) || 0), 0), [products]);

  const grouped = useMemo(() => {
    const map = new Map();
    for (const sale of activeSales) {
      const key = PERIOD_FN[period](sale.timestamp);
      if (!map.has(key)) map.set(key, { key, revenue: 0, cost: 0, itemsSold: 0, transactions: 0, latestTs: sale.timestamp });
      const b = map.get(key);
      b.revenue += sale.total; b.transactions += 1; b.latestTs = Math.max(b.latestTs, sale.timestamp);
      for (const it of sale.items) { b.itemsSold += it.qty; b.cost += (it.cost || 0) * it.qty; }
    }
    return Array.from(map.values()).sort((a, b) => b.latestTs - a.latestTs);
  }, [activeSales, period]);

  const chartData = useMemo(() => [...grouped].reverse().slice(-14), [grouped]);
  const maxRevenue = Math.max(1, ...chartData.map(g => g.revenue));

  const topProducts = useMemo(() => {
    const map = new Map();
    for (const sale of activeSales) for (const it of sale.items) {
      if (!map.has(it.productId)) map.set(it.productId, { name: it.name, qty: 0, revenue: 0 });
      const e = map.get(it.productId); e.qty += it.qty; e.revenue += it.qty * it.price;
    }
    return Array.from(map.values()).sort((a, b) => b.qty - a.qty).slice(0, 5);
  }, [activeSales]);

  const totals = grouped.reduce((acc, g) => ({ revenue: acc.revenue + g.revenue, items: acc.items + g.itemsSold, tx: acc.tx + g.transactions }), { revenue: 0, items: 0, tx: 0 });
  const periodLabels = { day: t("day"), week: t("week"), month: t("month") };

  return h("div", { className: "flex flex-col h-full pos-page-anim max-w-7xl mx-auto w-full" },

      h("div", null,
        h("h1", { className: "text-xl font-bold tracking-tight", style: { color: C.ink } }, t("reportsTitle")),
        h("p", { className: "text-xs font-medium", style: { color: C.inkDim } }, t("reportsSubtitle"))),
      h("div", { className: "flex rounded-xl p-1 border border-gray-200 shadow-inner", style: { background: C.roseTint } },
        ["day", "week", "month"].map(p => h("button", {
          key: p, onClick: () => setPeriod(p),
          className: "px-3.5 py-1.5 text-xs font-bold rounded-lg transition",
          style: { background: period === p ? "#fff" : "transparent", color: period === p ? C.roseDeep : C.inkDim }
        }, periodLabels[p])))),
    h("div", { className: "flex-1 overflow-y-auto px-4 sm:px-6 pb-6" },
      h("div", { className: "grid grid-cols-2 gap-3.5 mb-5" },
        h(StatCard, { label: t("stockCost"), value: moneyUSD(stockCost), subValue: moneyKHR(stockCost, exchangeRate), color: C.warn, icon: IconBox }),
        h(StatCard, { label: t("totalStockValue"), value: moneyUSD(stockValue), subValue: moneyKHR(stockValue, exchangeRate), color: C.sage, icon: IconDollar })),
      activeSales.length === 0 ? h(EmptyState, { icon: IconChart, title: t("noSalesTitle"), body: t("noSalesBody") })
      : h(React.Fragment, null,
          h("div", { className: "grid grid-cols-3 gap-3.5 mb-5" },
            h(StatCard, { label: t("totalRevenue"), value: moneyUSD(totals.revenue), subValue: moneyKHR(totals.revenue, exchangeRate), color: C.roseDeep, icon: IconTrend }),
            h(StatCard, { label: t("itemsSold"), value: totals.items, color: C.sage, icon: IconCart }),
            h(StatCard, { label: t("transactions"), value: totals.tx, color: C.ink, icon: IconChart })),
          h("div", { className: "rounded-2xl p-5 mb-5 shadow-sm border border-gray-200", style: { background: C.panel } },
            h("h3", { className: "text-xs font-bold tracking-wider uppercase mb-4", style: { color: C.inkDim } }, `${t("revenueBy")} ${periodLabels[period]}${chartData.length > 0 ? ` (${chartData.length})` : ""}`),
            h("div", { className: "flex items-end gap-2 pt-2", style: { height: 180 } },
              chartData.map(g => h("div", { key: g.key, className: "flex-1 flex flex-col items-center justify-end h-full group relative", title: `${g.key}: ${moneyUSD(g.revenue)}` },
                h("div", { className: "text-[10px] font-bold mb-1 tabular-nums opacity-80 group-hover:opacity-100", style: { color: C.inkDim } }, g.revenue > 0 ? moneyUSD(g.revenue).replace("$", "") : ""),
                h("div", { style: { width: "100%", maxWidth: 36, height: `${Math.max(6, (g.revenue / maxRevenue) * 140)}px`, background: "linear-gradient(180deg, #D48C9D 0%, #B85C70 100%)", borderRadius: "6px 6px 0 0" } }),

                  h("td", { className: "px-3 py-3 text-right tabular-nums text-xs", style: { color: C.inkDim } }, g.itemsSold),
                  h("td", { className: "px-3 py-3 text-right tabular-nums text-xs font-semibold", style: { color: C.ink } }, moneyUSD(g.revenue)),

            h("div", { className: "rounded-2xl p-5 shadow-sm border border-gray-200", style: { background: C.panel } },

  const [logOpen, setLogOpen] = useState(false);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ products, sales, settings, stockLog, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `makara-pos-backup-${dayKey(Date.now())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.products) || !Array.isArray(data.sales)) throw new Error("bad file");
        if (confirm("Restore this backup file?")) { onImport(data); onClose(); }
      } catch { alert("Invalid backup file."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const handleQrFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setQrBusy(true);
    try {
      const dataUrl = await compressImage(file, 500, 0.85);
      onSaveSettings({ ...settings, qrCode: dataUrl });
    } finally { setQrBusy(false); }
  };

  const commitSettings = () => {
    const n = Math.max(0, Math.floor(Number(threshold) || 0));
    const r = Math.max(1000, Math.floor(Number(exchangeRate) || 4100));
    onSaveSettings({ ...settings, lowStockThreshold: n, exchangeRate: r });
  };

  return h(SheetShell, { onClose },
      h("div", { className: "flex items-center justify-between px-6 py-4", style: { borderBottom: `1px solid ${C.border}` } },
        h("h2", { className: "font-semibold text-base", style: { color: C.ink } }, t("settings")),
        h("button", { onClick: onClose, className: "p-2 -mr-2 text-gray-400 hover:text-gray-600" }, h(IconX, { size: 18 }))),
      h("div", { className: "px-6 py-5 space-y-5 flex-1 overflow-y-auto" },

        // Currency Exchange Rate Setting
        h("div", { className: "p-4 rounded-2xl border border-gray-200" },
          h(Field, { label: t("exchangeRateLabel") },
            h("div", { className: "flex items-center gap-2 mt-1" },
              h("input", { type: "number", min: "1000", step: "50", className: "pos-input flex-1 text-xs font-semibold tabular-nums", value: exchangeRate, onChange: (e) => setExchangeRate(e.target.value), onBlur: commitSettings }),
              h("button", { onClick: commitSettings, className: "pos-btn-ghost text-xs border border-gray-200" }, t("saveChanges"))))),

        // QR Code Section
        h("div", { className: "p-4 rounded-2xl border border-gray-200", style: { background: C.roseTint } },
          h("div", { className: "text-xs font-bold tracking-wider uppercase mb-2", style: { color: C.ink } }, t("paymentQr")),
          h("div", { className: "flex items-center gap-3" },
            h("button", {
              onClick: () => qrFileRef.current && qrFileRef.current.click(),
              className: "w-16 h-16 rounded-xl flex items-center justify-center overflow-hidden shrink-0 shadow-sm transition hover:opacity-90",
              style: { background: "#fff", border: `1.5px dashed ${C.rose}` }
            }, qrBusy ? "..." : settings.qrCode ? h("img", { src: settings.qrCode, className: "w-full h-full object-contain" }) : h(IconQr, { size: 24, color: C.roseDeep })),
            h("div", { className: "text-xs", style: { color: C.inkDim } },
              h("button", { onClick: () => qrFileRef.current && qrFileRef.current.click(), className: "font-semibold underline block", style: { color: C.roseDeep } }, t("uploadQr")),
              h("div", { className: "mt-0.5 text-[11px]" }, t("qrHint")),
              settings.qrCode ? h("button", { onClick: () => onSaveSettings({ ...settings, qrCode: "" }), className: "mt-1.5 font-medium underline block", style: { color: C.warn } }, t("removeQr")) : null),
            h("input", { ref: qrFileRef, type: "file", accept: "image/*", className: "hidden", onChange: handleQrFile }))),

        // Low stock threshold
        h("div", { className: "p-4 rounded-2xl border border-gray-200" },
          h(Field, { label: t("lowStockThreshold") },
            h("div", { className: "flex items-center gap-2 mt-1" },
              h("input", { type: "number", min: "0", step: "1", className: "pos-input w-24 text-xs font-semibold", value: threshold, onChange: (e) => setThreshold(e.target.value), onBlur: commitSettings }),
              h("button", { onClick: commitSettings, className: "pos-btn-ghost text-xs border border-gray-200" }, t("saveChanges")))),
          h("p", { className: "text-[11px] mt-2", style: { color: C.inkDim } }, t("lowStockThresholdHint")),
          h("button", { onClick: () => setLogOpen(true), className: "text-xs mt-3 font-semibold underline block", style: { color: C.roseDeep } }, t("viewStockLog"))),

        // Data Backup
        h("div", { className: "p-4 rounded-2xl border border-gray-200" },
          h("p", { className: "text-xs mb-3 leading-relaxed", style: { color: C.inkDim } }, t("settingsDataNote")),
          h("button", { onClick: exportData, className: "w-full text-left px-4 py-3 rounded-xl text-xs font-semibold flex items-center justify-between border border-gray-200 transition hover:bg-gray-50" },
            h("span", null, t("exportBackup")), h(IconDown, { size: 14, color: C.sage })),
          h("button", { onClick: () => fileRef.current && fileRef.current.click(), className: "w-full text-left px-4 py-3 rounded-xl text-xs font-semibold flex items-center justify-between border border-gray-200 mt-2 transition hover:bg-gray-50" },
            h("span", null, t("restoreBackup")), h(IconUp, { size: 14, color: C.roseDeep })),
          h("input", { ref: fileRef, type: "file", accept: "application/json", className: "hidden", onChange: handleFile }))
      ),
      logOpen ? h(StockLogModal, { stockLog, onClose: () => setLogOpen(false) }) : null
  );
}

// ---------- Main App Container ----------
function App() {
  const [products, setProducts] = useState([]);
  const [sales, setSales] = useState([]);
  const [settings, setSettings] = useState({ exchangeRate: 4100, lowStockThreshold: 5, qrCode: "" });
  const [stockLog, setStockLog] = useState([]);
  const [cart, setCart] = useState([]);
  const [page, setPage] = useState("sales");
  const [toast, setToast] = useState("");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [lang, setLang] = useState("en");
  const [cloudStatus, setCloudStatus] = useState("syncing");
  const [now, setNow] = useState(() => Date.now());
  const [lastSale, setLastSale] = useState(null);
  const [viewSale, setViewSale] = useState(null);

  const t = (key) => (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;

  // Load IndexedDB on Mount
  useEffect(() => {
    let active = true;
    (async () => {
      await syncLegacyStorage();
      const p = await getDBItem("products", "main", []);
      const s = await getDBItem("sales", "main", []);
      const set = await getDBItem("settings", "main", { exchangeRate: 4100, lowStockThreshold: 5, qrCode: "" });
      const log = await getDBItem("stockLog", "main", []);
      if (active) {
        setProducts(p); setSales(s); setSettings(set); setStockLog(log);
        setCloudStatus("online");
      }
    })();
    return () => { active = false; };
  }, []);

  // Keyboard Shortcuts Listener
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === "F2") {
        e.preventDefault();
        document.getElementById("pos-search-input")?.focus();
      } else if (e.key === "Escape") {
        if (settingsOpen) setSettingsOpen(false);
        else if (lastSale) setLastSale(null);
        else if (viewSale) setViewSale(null);
        else if (cart.length > 0) { setCart([]); playPOSSound("error"); }
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [settingsOpen, lastSale, viewSale, cart]);

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  const persist = async (nextProducts, nextSales, nextSettings, nextStockLog) => {
    setProducts(nextProducts); setSales(nextSales); setSettings(nextSettings); setStockLog(nextStockLog);
    await setDBItem("products", "main", nextProducts);
    await setDBItem("sales", "main", nextSales);
    await setDBItem("settings", "main", nextSettings);
    await setDBItem("stockLog", "main", nextStockLog);
  };

  const changeLang = (l) => setLang(l);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  const addProduct = (p) => { const next = [...products, p]; persist(next, sales, settings, stockLog); showToast(t("toastProductAdded")); };
  const editProduct = (p) => { const next = products.map(x => x.id === p.id ? p : x); persist(next, sales, settings, stockLog); showToast(t("toastProductUpdated")); };
  const deleteProduct = (id) => { const next = products.filter(x => x.id !== id); persist(next, sales, settings, stockLog); setCart(c => c.filter(x => x.id !== id)); };

  const adjustStock = (product, delta, reason) => {
    if (!delta) return;
    const nextProducts = products.map(p => p.id === product.id ? { ...p, qty: clampQty(p.qty + delta) } : p);
    const entry = { id: uid(), timestamp: Date.now(), productId: product.id, productName: product.name, delta, reason: (reason || "").trim() };
    const nextLog = [...stockLog, entry];
    persist(nextProducts, sales, settings, nextLog);
    showToast(t("stockAdjusted"));
  };

  const saveSettings = (nextSettings) => {
    persist(products, sales, nextSettings, stockLog);
  };

  const importProducts = (rows) => {
    let updated = 0, added = 0;
    let nextProducts = [...products];
    for (const row of rows) {
      const name = String(row.Name || row.name || "").trim();
      const qty = Number(row.Qty ?? row.qty ?? 0);
      const cost = Number(row.Cost ?? row.cost ?? 0);
      const price = Number(row.Price ?? row.price ?? 0);
      if (!name || qty < 0 || cost < 0 || price < 0) continue;
      const sku = String(row.SKU || row.sku || "").trim();
      const type = String(row.Type || row.type || "").trim();
      const idx = sku ? nextProducts.findIndex(p => p.sku === sku) : -1;
      if (idx >= 0) {
        nextProducts[idx] = { ...nextProducts[idx], name, type, qty: clampQty(qty), cost, price };
        updated++;
      } else {
        nextProducts.push({ id: uid(), name, sku: sku || "SKU-" + uid().slice(-6).toUpperCase(), type, qty: clampQty(qty), cost, price, photo: "" });
        added++;
      }
    }
    persist(nextProducts, sales, settings, stockLog);
    showToast(`${t("importSuccessLabel")}: ${updated} updated, ${added} added`);
  };

  const handleCheckout = ({ cart: items, subtotal, discountAmount, total, paymentDetails }) => {
    const sale = { id: uid(), timestamp: Date.now(), items: items.map(i => ({ productId: i.id, name: i.name, qty: i.qty, price: i.price, cost: i.cost })), subtotal, discountAmount, total, paymentDetails, voided: false };
    const nextSales = [...sales, sale];
    const nextProducts = products.map(p => { const bought = items.find(i => i.id === p.id); return bought ? { ...p, qty: Math.max(0, p.qty - bought.qty) } : p; });
    persist(nextProducts, nextSales, settings, stockLog);
    showToast(t("toastSaleCompleted"));
    setLastSale(sale);
  };

  const voidSale = (saleId) => {
    const sale = sales.find(s => s.id === saleId);
    if (!sale || sale.voided) return;
    const nextProducts = products.map(p => {
      const line = sale.items.find(i => i.productId === p.id);
      return line ? { ...p, qty: (Number(p.qty) || 0) + line.qty } : p;
    });
    const nextSales = sales.map(s => s.id === saleId ? { ...s, voided: true } : s);
    persist(nextProducts, nextSales, settings, stockLog);
    showToast(t("toastSaleVoided"));
  };

  const NAV = [
    { id: "sales", label: t("navSales"), icon: IconCart },
    { id: "inventory", label: t("navInventory"), icon: IconBox },
    { id: "reports", label: t("navReports"), icon: IconChart },
    { id: "salesHistory", label: t("navSalesHistory"), icon: IconTrend },
  ];

  const clockStr = new Date(now).toLocaleString(lang === "km" ? "km-KH" : "en-US", { hour: "numeric", minute: "2-digit" });

  return h(LangContext.Provider, { value: lang },
  h("div", { className: "w-full min-h-screen flex flex-col", style: { background: C.bg } },

    // Header Navbar
    h("header", { className: "w-full shadow-lg shrink-0 border-b border-white/10 z-30", style: { background: C.ink, color: "#fff" } },
      h("div", { className: "max-w-7xl mx-auto flex items-center justify-between gap-3 px-4 sm:px-6 py-3" },
        
        h("div", { className: "flex items-center gap-2.5 min-w-0 shrink-0" },
          h("div", { className: "p-2 rounded-xl shadow-inner", style: { background: "rgba(252, 235, 240, 0.12)" } },
            h(IconSparkles, { size: 18, color: C.rose })),
          h("div", { className: "min-w-0" },
            h("div", { className: "brand-font text-base sm:text-lg font-semibold tracking-wider text-white truncate" }, "MAKARA"),
            h("div", { className: "text-[9px] uppercase tracking-widest font-bold opacity-60 text-pink-100" }, "Cosmetics POS"))),

        h("nav", { className: "hidden md:flex items-center gap-1.5 p-1 rounded-2xl border border-white/10", style: { background: "rgba(255,255,255,0.05)" } },
          NAV.map(n => {
            const active = page === n.id;
            return h("button", {
              key: n.id, onClick: () => { setPage(n.id); triggerHaptic(8); playPOSSound("add"); },
              className: "pos-nav-btn flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all",
              style: { background: active ? C.roseDeep : "transparent", color: active ? "#fff" : "rgba(255,255,255,0.7)" }
            }, h(n.icon, { size: 14 }), h("span", null, n.label));
          })),

        h("div", { className: "flex items-center gap-2 shrink-0" },
          h("div", { className: "hidden sm:flex items-center gap-1.5 text-xs font-mono font-medium px-2.5 py-1 rounded-full border border-white/10 bg-white/5 opacity-80" },
            h(IconClock, { size: 12, color: C.rose }), h("span", null, clockStr)),

          h("div", { className: "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold tracking-wider border border-white/10 bg-white/5" },
            h("span", { className: "w-2 h-2 rounded-full shrink-0 animate-pulse", style: { background: C.sage } }),
            h("span", { className: "hidden lg:inline opacity-80" }, t("statusOffline"))),

          h("div", { className: "flex rounded-xl overflow-hidden text-xs font-bold border border-white/10 bg-white/5 p-0.5" },
            h("button", { onClick: () => changeLang("en"), className: "px-2 py-0.5 rounded-lg transition", style: { background: lang === "en" ? C.roseDeep : "transparent", color: "#fff" } }, "EN"),
            h("button", { onClick: () => changeLang("km"), className: "px-2 py-0.5 rounded-lg transition", style: { background: lang === "km" ? C.roseDeep : "transparent", color: "#fff" } }, "ខ្មែរ")),

          h("button", {
            onClick: () => setSettingsOpen(true),
            className: "pos-nav-btn flex items-center justify-center w-8 h-8 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-white transition",
            title: t("settings")
          }, h(IconSettings, { size: 16 }))
        )
      ),

      h("div", { className: "md:hidden flex items-center justify-around px-2 py-1.5 border-t border-white/10 bg-black/20" },
        NAV.map(n => {
          const active = page === n.id;
          return h("button", {
            key: n.id, onClick: () => { setPage(n.id); triggerHaptic(8); playPOSSound("add"); },
            className: "flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-[10px] font-medium transition",
            style: { color: active ? C.rose : "rgba(255,255,255,0.6)" }
          }, h(n.icon, { size: 16 }), h("span", null, n.label));
        }))
    ),

    // Keyboard Shortcuts Bar
    h("div", { className: "w-full bg-pink-950/20 text-center py-1 text-[11px] font-mono opacity-60 hidden md:block" }, t("shortcutHint")),

    // Main Content Area
    h("main", { className: "flex-1 min-w-0" },
      page === "inventory" ? h(InventoryPage, { products, exchangeRate: settings.exchangeRate || 4100, onAdd: addProduct, onEdit: editProduct, onDelete: deleteProduct, onAdjustStock: adjustStock, lowStockThreshold: settings.lowStockThreshold, onImportProducts: importProducts }) : null,
      page === "sales" ? h(SalesPage, { products, cart, setCart, exchangeRate: settings.exchangeRate || 4100, onCheckout: handleCheckout, onAddProduct: addProduct }) : null,
      page === "reports" ? h(ReportsPage, { sales, products, exchangeRate: settings.exchangeRate || 4100 }) : null,
      page === "salesHistory" ? h(SalesHistoryPage, { sales, exchangeRate: settings.exchangeRate || 4100, onVoid: voidSale, onViewReceipt: setViewSale }) : null),
    
    settingsOpen ? h(SettingsSheet, { products, sales, settings, onSaveSettings: saveSettings, stockLog, onImport: (d) => { setProducts(d.products); setSales(d.sales); }, onClose: () => setSettingsOpen(false) }) : null,
    lastSale ? h(ReceiptModal, { sale: lastSale, qrCode: settings.qrCode, exchangeRate: settings.exchangeRate || 4100, onClose: () => setLastSale(null) }) : null,
    viewSale ? h(ReceiptModal, { sale: viewSale, qrCode: settings.qrCode, exchangeRate: settings.exchangeRate || 4100, onClose: () => setViewSale(null) }) : null,
    h(Toast, { message: toast })
  ));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
