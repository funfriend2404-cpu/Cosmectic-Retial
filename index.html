  .pos-nav-btn:active { transform: scale(0.95); }

  @keyframes pos-sheet-up { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  @keyframes pos-modal-in { from { opacity:0; transform: translateY(10px) scale(0.98); } to { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes pos-overlay-in { from { opacity:0; } to { opacity:1; } }

  .pos-cart-pulse { animation: pos-pulse .28s ease; }
  .pos-row-flash { animation: pos-flash .6s ease; }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = (n) => `$${(Number(n) || 0).toFixed(2)}`;
const clampQty = (n) => Math.max(0, Math.floor(Number(n) || 0));

function compressImage(file, maxWidth = 420, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dayKey(ts) { return new Date(ts).toISOString().slice(0, 10); }
function weekKey(ts) {
  const date = new Date(ts);
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()} \u00B7 Wk ${String(weekNo).padStart(2, "0")}`;
}
function monthKey(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }
function dayLabel(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }

// Every device that opens this site talks to the same tiny API below,
// so products, sales, settings and the stock log stay in sync across
// devices automatically.
const CLOUD_API = "/.netlify/functions/data";
async function loadCloud() {
  try {
    const res = await fetch(CLOUD_API, { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    return await res.json();
  } catch (e) { return null; }
}
async function saveCloud(products, sales, settings, stockLog) {
  try {
    await fetch(CLOUD_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ products, sales, settings, stockLog }),
    });
    return true;
  } catch (e) { return false; }
}

  const addToCart = (p) => {
    if (p.qty <= 0) return;
    setCart(prev => {
      const existing = prev.find(c => c.id === p.id);
      if (existing) { if (existing.qty >= p.qty) return prev; return prev.map(c => c.id === p.id ? { ...c, qty: c.qty + 1 } : c); }
      return [...prev, { id: p.id, name: p.name, price: p.price, cost: p.cost, qty: 1, stock: p.qty }];
    });
    pulseCart(); flashItem(p.id);
  };
  const setCartQty = (p, qty) => {
    setCart(prev => {
      const clamped = clampQty(Math.min(qty, p.qty));
      if (clamped <= 0) return prev.filter(c => c.id !== p.id);
      const existing = prev.find(c => c.id === p.id);
      if (existing) return prev.map(c => c.id === p.id ? { ...c, qty: clamped } : c);

// ---------- Reports page ----------
function ReportsPage({ sales, products }) {
  const t = useT();
  const [period, setPeriod] = useState("day");
  const activeSales = useMemo(() => sales.filter(s => !s.voided), [sales]);
  const stockCost = useMemo(() => products.reduce((s, p) => s + (Number(p.cost) || 0) * (Number(p.qty) || 0), 0), [products]);
  const stockValue = useMemo(() => products.reduce((s, p) => s + (Number(p.price) || 0) * (Number(p.qty) || 0), 0), [products]);
  const grouped = useMemo(() => {
    const map = new Map();
    for (const sale of activeSales) {
      const key = PERIOD_FN[period](sale.timestamp);
      if (!map.has(key)) map.set(key, { key, revenue: 0, cost: 0, itemsSold: 0, transactions: 0, latestTs: sale.timestamp });
      const b = map.get(key);
      b.revenue += sale.total; b.transactions += 1; b.latestTs = Math.max(b.latestTs, sale.timestamp);
      for (const it of sale.items) { b.itemsSold += it.qty; b.cost += (it.cost || 0) * it.qty; }
    }
    return Array.from(map.values()).sort((a, b) => b.latestTs - a.latestTs);
  }, [activeSales, period]);

  const chartData = useMemo(() => [...grouped].reverse().slice(-14), [grouped]);
  const maxRevenue = Math.max(1, ...chartData.map(g => g.revenue));

  const topProducts = useMemo(() => {
    const map = new Map();
    for (const sale of activeSales) for (const it of sale.items) {
      if (!map.has(it.productId)) map.set(it.productId, { name: it.name, qty: 0, revenue: 0 });

// ---------- Settings sheet (backup controls) ----------
function SettingsSheet({ products, sales, settings, onSaveSettings, stockLog, onImport, onClose }) {
  const t = useT();
  const fileRef = useRef(null);
  const qrFileRef = useRef(null);
  const [qrBusy, setQrBusy] = useState(false);
  const [threshold, setThreshold] = useState(settings.lowStockThreshold);
  const [logOpen, setLogOpen] = useState(false);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ products, sales, settings, stockLog, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `makara-pos-backup-${dayKey(Date.now())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.products) || !Array.isArray(data.sales)) throw new Error("bad file");
        if (confirm("Restore this backup? It will replace all current inventory and sales data on this device.")) { onImport(data); onClose(); }
      } catch { alert("Couldn't read that backup file."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const handleQrFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setQrBusy(true);
    try {
      const dataUrl = await compressImage(file, 500, 0.85);
      onSaveSettings({ ...settings, qrCode: dataUrl });
    } finally { setQrBusy(false); }
  };
  const commitThreshold = () => {
    const n = Math.max(0, Math.floor(Number(threshold) || 0));
    onSaveSettings({ ...settings, lowStockThreshold: n });
  };

  return h(SheetShell, { onClose },
      h("div", { className: "flex items-center justify-between px-5 py-4", style: { borderBottom: `1px solid ${C.border}` } },
        h("h2", { className: "font-semibold text-base", style: { color: C.ink } }, t("settings")),
        h("button", { onClick: onClose, className: "p-2 -mr-2 rounded-lg" }, h(IconX, { size: 18 }))),
      h("div", { className: "px-5 py-4 space-y-5 flex-1", style: { overflowY: "auto", paddingBottom: "calc(1rem + env(safe-area-inset-bottom))" } },

        // QR code
        h("div", null,
          h("div", { className: "text-sm font-medium mb-2", style: { color: C.ink } }, t("paymentQr")),
          h("div", { className: "flex items-center gap-3" },
            h("button", {
              onClick: () => qrFileRef.current && qrFileRef.current.click(),
              className: "w-16 h-16 rounded-xl flex items-center justify-center overflow-hidden shrink-0",
              style: { background: C.roseTint, border: `1px dashed ${C.rose}`, minWidth: 44, minHeight: 44 }
            }, qrBusy ? "..." : settings.qrCode ? h("img", { src: settings.qrCode, className: "w-full h-full object-contain" }) : h(IconQr, { size: 22 })),
            h("div", { className: "text-xs", style: { color: C.inkDim } },
              h("button", { onClick: () => qrFileRef.current && qrFileRef.current.click(), className: "font-medium underline", style: { color: C.roseDeep } }, t("uploadQr")),
              h("div", { className: "mt-1" }, t("qrHint")),
              settings.qrCode ? h("button", { onClick: () => onSaveSettings({ ...settings, qrCode: "" }), className: "mt-1 underline", style: { color: C.warn } }, t("removeQr")) : null),
            h("input", { ref: qrFileRef, type: "file", accept: "image/*", className: "hidden", onChange: handleQrFile }))),

        // low stock threshold
        h("div", null,
          h(Field, { label: t("lowStockThreshold") },
            h("div", { className: "flex items-center gap-2" },
              h("input", { type: "number", min: "0", step: "1", className: inputCls + " w-24", value: threshold, onChange: (e) => setThreshold(e.target.value), onBlur: commitThreshold }),
              h("button", { onClick: commitThreshold, className: "pos-btn-ghost", style: { border: `1px solid ${C.border}` } }, t("saveChanges")))),
          h("p", { className: "text-xs mt-1.5", style: { color: C.inkDim } }, t("lowStockThresholdHint")),
          h("button", { onClick: () => setLogOpen(true), className: "text-xs mt-2 underline", style: { color: C.roseDeep } }, t("viewStockLog"))),

        h("div", null,
          h("p", { className: "text-xs mb-2", style: { color: C.inkDim } }, t("settingsDataNote")),
          h("button", { onClick: exportData, className: "w-full text-left px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2", style: { background: C.roseTint, color: C.roseDeep, minHeight: 44 } }, "\u2B07 " + t("exportBackup")),
          h("button", { onClick: () => fileRef.current && fileRef.current.click(), className: "w-full text-left px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2 mt-2", style: { border: `1px solid ${C.border}`, color: C.ink, minHeight: 44 } }, "\u2B06 " + t("restoreBackup")),

// ---------- App ----------
function App() {
  const [products, setProducts] = useState(() => loadKey(KEY_PRODUCTS, []));
  const [sales, setSales] = useState(() => loadKey(KEY_SALES, []));
  const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...loadKey(KEY_SETTINGS, {}) }));
  const [stockLog, setStockLog] = useState(() => loadKey(KEY_STOCKLOG, []));
  const [cart, setCart] = useState([]);
  const [page, setPage] = useState("sales");
  const [toast, setToast] = useState("");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [lang, setLang] = useState(() => loadKey(KEY_LANG, "en"));
  const [cloudStatus, setCloudStatus] = useState("syncing"); // "syncing" | "online" | "offline"
  const [lastSync, setLastSync] = useState(null);
  const [now, setNow] = useState(() => Date.now());
  const [lastSale, setLastSale] = useState(null);
  const [viewSale, setViewSale] = useState(null);
  const t = (key) => (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;

  // live clock
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  // On load: show the local (this-device) copy instantly, then reconcile with
  // the shared cloud copy as soon as it arrives so every device agrees.
  useEffect(() => {
    let cancelled = false;
    loadCloud().then((data) => {
      if (cancelled) return;
      if (data && Array.isArray(data.products) && Array.isArray(data.sales)) {
        const cloudSettings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
        const cloudStockLog = Array.isArray(data.stockLog) ? data.stockLog : [];
        setProducts(data.products); setSales(data.sales); setSettings(cloudSettings); setStockLog(cloudStockLog);
        saveKey(KEY_PRODUCTS, data.products); saveKey(KEY_SALES, data.sales);
        saveKey(KEY_SETTINGS, cloudSettings); saveKey(KEY_STOCKLOG, cloudStockLog);
        setCloudStatus("online"); setLastSync(Date.now());
      } else {
        setCloudStatus("offline");
      }
    });
    return () => { cancelled = true; };
  }, []);

  const persist = (nextProducts, nextSales, nextSettings, nextStockLog) => {
    saveKey(KEY_PRODUCTS, nextProducts);
    saveKey(KEY_SALES, nextSales);
    saveKey(KEY_SETTINGS, nextSettings);
    saveKey(KEY_STOCKLOG, nextStockLog);
    saveCloud(nextProducts, nextSales, nextSettings, nextStockLog).then(ok => { setCloudStatus(ok ? "online" : "offline"); if (ok) setLastSync(Date.now()); });
  };

  const changeLang = (l) => { setLang(l); saveKey(KEY_LANG, l); };
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  const addProduct = (p) => { const next = [...products, p]; setProducts(next); persist(next, sales, settings, stockLog); showToast(t("toastProductAdded")); };
  const editProduct = (p) => { const next = products.map(x => x.id === p.id ? p : x); setProducts(next); persist(next, sales, settings, stockLog); showToast(t("toastProductUpdated")); };
  const deleteProduct = (id) => { const next = products.filter(x => x.id !== id); setProducts(next); persist(next, sales, settings, stockLog); setCart(c => c.filter(x => x.id !== id)); };

  const adjustStock = (product, delta, reason) => {
    if (!delta) return;
    const nextProducts = products.map(p => p.id === product.id ? { ...p, qty: clampQty(p.qty + delta) } : p);
    const entry = { id: uid(), timestamp: Date.now(), productId: product.id, productName: product.name, delta, reason: (reason || "").trim() };
    const nextLog = [...stockLog, entry];
    setProducts(nextProducts); setStockLog(nextLog);
    persist(nextProducts, sales, settings, nextLog);
    showToast(t("stockAdjusted"));
  };

  const saveSettings = (nextSettings) => {
    setSettings(nextSettings);
    persist(products, sales, nextSettings, stockLog);
  };

  const importProducts = (rows) => {
    let updated = 0, added = 0, skipped = 0;
    let nextProducts = [...products];
    for (const row of rows) {
      const name = String(row.Name || row.name || "").trim();
      const qty = Number(row.Qty ?? row.qty ?? 0);
      const cost = Number(row.Cost ?? row.cost ?? 0);
      const price = Number(row.Price ?? row.price ?? 0);
      if (!name || qty < 0 || cost < 0 || price < 0 || Number.isNaN(qty) || Number.isNaN(cost) || Number.isNaN(price)) { skipped++; continue; }
      const sku = String(row.SKU || row.sku || "").trim();
      const type = String(row.Type || row.type || "").trim();
      const idx = sku ? nextProducts.findIndex(p => p.sku === sku) : -1;
      if (idx >= 0) {
        nextProducts[idx] = { ...nextProducts[idx], name, type, qty: clampQty(qty), cost, price };
        updated++;
      } else {
        nextProducts.push({ id: uid(), name, sku: sku || "SKU-" + uid().slice(-6).toUpperCase(), type, qty: clampQty(qty), cost, price, photo: "" });
        added++;
      }
    }
    setProducts(nextProducts);
    persist(nextProducts, sales, settings, stockLog);
    showToast(`${t("importSuccessLabel")}: ${updated} ${lang === "km" ? "" : "updated"}${lang === "km" ? STRINGS.km.importSummary : ""}, ${added} ${lang === "km" ? "" : "added"}${skipped ? ` (${skipped} skipped)` : ""}`);
  };

  const handleCheckout = ({ cart: items, subtotal, discountAmount, total }) => {
    const sale = { id: uid(), timestamp: Date.now(), items: items.map(i => ({ productId: i.id, name: i.name, qty: i.qty, price: i.price, cost: i.cost })), subtotal, discountAmount, total, voided: false };
    const nextSales = [...sales, sale]; setSales(nextSales);
    const nextProducts = products.map(p => { const bought = items.find(i => i.id === p.id); return bought ? { ...p, qty: Math.max(0, p.qty - bought.qty) } : p; });
    setProducts(nextProducts);
    persist(nextProducts, nextSales, settings, stockLog);
    showToast(t("toastSaleCompleted"));
    setLastSale(sale);
  };

  const voidSale = (saleId) => {
    const sale = sales.find(s => s.id === saleId);
    if (!sale || sale.voided) return;
    // Restore the sold quantities back onto matching products.
    const nextProducts = products.map(p => {
      const line = sale.items.find(i => i.productId === p.id);
      return line ? { ...p, qty: (Number(p.qty) || 0) + line.qty } : p;
    });
    const nextSales = sales.map(s => s.id === saleId ? { ...s, voided: true } : s);
    setProducts(nextProducts);
    setSales(nextSales);
    persist(nextProducts, nextSales, settings, stockLog);
    showToast(t("toastSaleVoided"));
  };

  const handleImport = (data) => {
    const nextSettings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
    const nextLog = Array.isArray(data.stockLog) ? data.stockLog : [];
    setProducts(data.products); setSales(data.sales); setSettings(nextSettings); setStockLog(nextLog);
    persist(data.products, data.sales, nextSettings, nextLog);
    showToast(t("toastBackupRestored"));
  };

  const NAV = [
    { id: "sales", label: t("navSales"), icon: IconCart },
    { id: "inventory", label: t("navInventory"), icon: IconBox },
    { id: "reports", label: t("navReports"), icon: IconChart },
    { id: "salesHistory", label: t("navSalesHistory"), icon: IconTrend },
  ];

  const statusColor = cloudStatus === "online" ? C.sage : cloudStatus === "syncing" ? "#D9B86A" : C.warn;
  const statusLabel = cloudStatus === "online" ? t("statusOnline") : cloudStatus === "syncing" ? t("statusSyncing") : t("statusOffline");
  const clockStr = new Date(now).toLocaleString(lang === "km" ? "km-KH" : "en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const timeOnlyStr = new Date(now).toLocaleTimeString(lang === "km" ? "km-KH" : "en-US", { hour: "numeric", minute: "2-digit" });

  return h(LangContext.Provider, { value: lang },
  h("div", {
    className: "w-full flex flex-col",
    style: { background: C.bg, minHeight: "100vh" }
  },

    // top navbar
    h("div", { className: "w-full flex items-center justify-between gap-2 sm:gap-3 px-3 sm:px-6 py-3 shrink-0", style: { background: C.rose } },
      h("div", { className: "flex items-center gap-2 min-w-0" },
        h("span", { style: { fontSize: 20 } }, "\u273F"),
        h("span", { className: "font-semibold text-sm sm:text-base truncate", style: { color: C.ink } }, "Makara Cosmectic")),
      h("div", { className: "flex items-center gap-1 sm:gap-1.5 shrink-0" },
        NAV.map(n => {
          const active = page === n.id;
          return h("button", {
            key: n.id, onClick: () => setPage(n.id),
            className: "pos-nav-btn flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 rounded-full text-xs sm:text-sm font-medium",
            style: { background: active ? "#fff" : "transparent", color: active ? C.roseDeep : C.ink }
          }, h(n.icon, { size: 15 }), h("span", { className: "hidden sm:inline" }, n.label));
        }),

        // live clock — compact on small screens
        h("div", { className: "hidden md:flex items-center gap-1 text-xs font-medium px-2 py-1 rounded-full", style: { background: "rgba(255,255,255,0.55)", color: C.ink } },
          h(IconClock, { size: 11 }), h("span", { className: "tabular-nums" }, clockStr)),
        h("div", { className: "md:hidden flex items-center text-xs font-medium px-1.5 py-1 rounded-full tabular-nums", style: { background: "rgba(255,255,255,0.55)", color: C.ink } }, timeOnlyStr),

        h("div", { className: "flex rounded-full overflow-hidden text-xs font-semibold", style: { background: "rgba(255,255,255,0.55)" } },
          h("button", { onClick: () => changeLang("en"), className: "px-2 sm:px-2.5 py-1.5", style: { background: lang === "en" ? "#fff" : "transparent", color: C.ink } }, "EN"),
          h("button", { onClick: () => changeLang("km"), className: "px-2 sm:px-2.5 py-1.5", style: { background: lang === "km" ? "#fff" : "transparent", color: C.ink } }, "\u1781\u17d2\u1798\u17c2\u179a")),

        // status pill — text hides on very small screens, dot always shows
        h("div", { className: "flex items-center gap-1.5 px-1.5 sm:px-2 py-1 rounded-full", style: { background: "rgba(255,255,255,0.35)" }, title: statusLabel },
          h("span", { className: "w-2 h-2 rounded-full shrink-0", style: { background: statusColor, transition: "background-color .3s ease" } }),
          h("span", { className: "hidden lg:inline text-xs font-medium", style: { color: C.ink } }, statusLabel)),

        h("button", {
          onClick: () => setSettingsOpen(true),
          className: "pos-nav-btn flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full",
          style: { color: C.ink }, title: t("settings")
        }, h(IconSettings, { size: 17 }))
      )
    ),

    h("div", { className: "flex-1 min-w-0" },
      page === "inventory" ? h(InventoryPage, { products, onAdd: addProduct, onEdit: editProduct, onDelete: deleteProduct, onAdjustStock: adjustStock, lowStockThreshold: settings.lowStockThreshold, onImportProducts: importProducts }) : null,
      page === "sales" ? h(SalesPage, { products, cart, setCart, onCheckout: handleCheckout, onAddProduct: addProduct }) : null,
      page === "reports" ? h(ReportsPage, { sales, products }) : null,
      page === "salesHistory" ? h(SalesHistoryPage, { sales, onVoid: voidSale, onViewReceipt: setViewSale }) : null),
    settingsOpen ? h(SettingsSheet, { products, sales, settings, onSaveSettings: saveSettings, stockLog, onImport: handleImport, onClose: () => setSettingsOpen(false) }) : null,
    lastSale ? h(ReceiptModal, { sale: lastSale, qrCode: settings.qrCode, onClose: () => setLastSale(null) }) : null,
    viewSale ? h(ReceiptModal, { sale: viewSale, qrCode: settings.qrCode, onClose: () => setViewSale(null) }) : null,
    h(Toast, { message: toast })
  ));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
